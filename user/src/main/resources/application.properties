spring.application.name=user-service
server.port=8082

#path of the Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# set duration to eureka server
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=10


# ----------------------------------------
# DNS FIX (IMPORTANT!) ? Prevent resolves to Sampath.mshome.net
# ----------------------------------------
spring.cloud.inetutils.preferred-networks=127.0.0.1,localhost
spring.cloud.inetutils.ignored-interfaces=docker0,vEthernet.*,VirtualBox.*,VMware.*,br-.*,veth.*,wsl.*,Npcap.*,lo0


management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
