spring.application.name=eureka-server
server.port=8761

# ----------------------------------------
# Eureka Server Settings
# ----------------------------------------
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Force Eureka to use only localhost
eureka.instance.hostname=localhost

# ----------------------------------------
# Spring Cloud Inet Utils (DNS Fix)
# Prevents Eureka from detecting Docker, WSL, Hyper-V or virtual adapters
# ----------------------------------------
spring.cloud.inetutils.preferred-networks=127.0.0.1,localhost
spring.cloud.inetutils.ignored-interfaces=docker0,vEthernet.*,VirtualBox.*,VMware.*,br-.*,veth.*,wsl.*,Npcap.*,lo0
