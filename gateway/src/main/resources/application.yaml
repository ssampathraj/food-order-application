server:
  port: 8084

spring:
  application:
    name: GATEWAY-SERVICE

  cloud:
    inetutils:
      preferred-networks:
        - 127.0.0.1
        - localhost
      ignored-interfaces:
        - docker0
        - vEthernet.*
        - VirtualBox.*
        - VMware.*
        - br-.*
        - veth.*
        - wsl.*
        - Npcap.*
        - lo0

    gateway:
      routes:
        # ---------- AUTH SERVICE ----------
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        # ---------- USER SERVICE ----------
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/user/**
          filters:
            - Name: AuthFilter

        # ---------- ORDER SERVICE ----------
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/order/**
          filters:
            - Name: AuthFilter

        # ---------- DELIVERY SERVICE ----------
        - id: delivery-service
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery/**
          filters:
            - Name: AuthFilter

        # ---------- EMAIL SERVICE ----------
        - id: email-service
          uri: lb://EMAIL-SERVICE
          predicates:
            - Path=/api/email/**
          filters:
            - Name: AuthFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
