server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: GATEWAY-SERVICE

  cloud:
    inetutils:
      preferred-networks:
        - 127.0.0.1
        - localhost
      ignored-interfaces:
        - docker0
        - vEthernet.*
        - VirtualBox.*
        - VMware.*
        - br-.*
        - veth.*
        - wsl.*
        - Npcap.*
        - lo0

    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/user/**
          filters:
            - Name: AuthFilter

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/order/**
          filters:
            - Name: AuthFilter

        - id: delivery-service
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery/**
          filters:
            - Name: AuthFilter

        - id: email-service
          uri: lb://EMAIL-SERVICE
          predicates:
            - Path=/api/email/**
          filters:
            - Name: AuthFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: "*"