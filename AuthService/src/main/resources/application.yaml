server:
  port: 8087

spring:
  cloud:
    inetutils:
      preferred-networks:
        - 127.0.0.1
      ignored-interfaces:
        - docker0
        - veth.*
        - br-.*
        - VirtualBox
        - Hyper-V
        - nat.*
  application:
    name: AUTH-SERVICE

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

