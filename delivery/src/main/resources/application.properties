spring.application.name=delivery-service
server.port=8081
#path of the Eureka Server - Support both localhost and Docker
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}
spring.profiles.active=dev
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
management.endpoints.web.exposure.include=*
management.endpoint.refresh.enabled=true
